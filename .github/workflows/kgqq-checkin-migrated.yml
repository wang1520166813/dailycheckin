name: KGQQ Check-in (Migrated)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  kgqq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - run: python scripts/create_kgqq_config.py
        env:
          KGQQ_COOKIES: ${{ secrets.KGQQ_COOKIE }}
      - run: dailycheckin --include KGQQ
        env:
          PYTHONUNBUFFERED: 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgqq-logs-migrated
          path: logs/
