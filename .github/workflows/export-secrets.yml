name: Export Secrets (temporary)

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Bundle secrets to artifact
        env:
          S1: ${{ secrets.BAIDU_TIEBA_COOKIES }}
          S2: ${{ secrets.ALYUN_DRIVE_COOKIES }}
          S3: ${{ secrets.KGQQ_COOKIE }}
        run: |
          mkdir -p out
          [ -n "$S1" ] && printf '%s' "$S1" | base64 -w0 > out/baidu_tieba_cookies.b64 || true
          [ -n "$S2" ] && printf '%s' "$S2" | base64 -w0 > out/aliyun_drive_refresh_token.b64 || true
          [ -n "$S3" ] && printf '%s' "$S3" | base64 -w0 > out/kgqq_cookie.b64 || true
          ls -la out/
          tar czf secrets_bundle.tgz -C out .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: secrets-bundle
          path: secrets_bundle.tgz
          retention-days: 1
