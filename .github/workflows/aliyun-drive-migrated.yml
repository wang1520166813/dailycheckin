name: Aliyun Drive Check-in (Migrated)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  aliyun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - run: python scripts/create_aliyun_config.py
        env:
          ALYUN_REFRESH_TOKEN: ${{ secrets.ALYUN_DRIVE_COOKIES }}
      - run: dailycheckin --include ALIYUN
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aliyun-logs-migrated
          path: logs/
