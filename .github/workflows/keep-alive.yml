name: Keep Alive

# 防止 GitHub 因仓库 60 天无活动而自动禁用定时 workflow
# 每周做一次空提交保持仓库活跃
on:
  schedule:
    - cron: '0 1 * * 1' # 每周一 北京时间 09:00 (UTC 01:00)
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PAT }}

      - name: Keep-alive empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive commit to prevent scheduled workflows from being disabled [skip ci]"
          git push
