name: Aliyun Drive Check-in

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  aliyun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Generate Aliyun Config
        run: python scripts/create_aliyun_config.py
        env:
          ALYUN_REFRESH_TOKEN: ${{ secrets.ALYUN_DRIVE_COOKIES }}
      - name: Run Aliyun Check-in
        run: dailycheckin --include ALIYUN
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aliyun-logs
          path: logs/
